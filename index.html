<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indonesian Shadowing AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 20;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

.version {
    margin-top: 5px;
    font-size: 12px;
    opacity: .7;
}

.container {
    width: min(1100px, 100%);
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.card h2 {
    margin: 0 0 14px;
    font-size: 18px;
}

textarea,
input {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 11px 12px;
    font-size: 15px;
    background: white;
}

textarea {
    min-height: 230px;
    resize: vertical;
    line-height: 1.75;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-green {
    background: #059669;
    color: white;
}

.btn-secondary {
    background: #e5e7eb;
    color: #111827;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-small {
    padding: 7px 10px;
    font-size: 12px;
}

.button-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.api-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: end;
}

.small {
    color: #6b7280;
    font-size: 12px;
}

.status {
    margin-top: 10px;
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
}

.status-info {
    background: #eff6ff;
    color: #1d4ed8;
}

.status-success {
    background: #ecfdf5;
    color: #047857;
}

.status-error {
    background: #fef2f2;
    color: #b91c1c;
}

.status-warning {
    background: #fffbeb;
    color: #b45309;
}

.progress-wrap {
    margin-top: 12px;
}

.progress {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width .2s;
}

.sentence-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.sentence-card {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px;
}

.sentence-number {
    color: #6b7280;
    font-size: 12px;
    margin-bottom: 7px;
}

.indonesian {
    font-size: 16px;
    line-height: 1.75;
    font-weight: 600;
}

.japanese {
    margin-top: 9px;
    padding: 10px;
    background: #f9fafb;
    border-radius: 8px;
    line-height: 1.75;
}

.sentence-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 10px;
}

.vocab-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
}

.vocab-card {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px;
}

.vocab-word {
    font-size: 17px;
    font-weight: 700;
}

.vocab-meaning {
    margin-top: 5px;
    color: #4b5563;
    line-height: 1.5;
}

.history-item {
    border: 1px solid #e5e7eb;
    border-radius: 9px;
    padding: 10px;

}

.history-title {
    font-weight: 600;
}

.history-date {
    margin-top: 4px;
    color: #6b7280;
    font-size: 12px;
}

.empty {
    text-align: center;
    color: #6b7280;
    padding: 20px;
}

.debug {
    background: #111827;
    color: #d1d5db;
    padding: 13px;
    border-radius: 9px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
}

.hidden {
    display: none !important;
}

@media (max-width: 700px) {
    .container {
        padding: 12px;
    }

    .api-row {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 18px;
    }

    textarea {
        min-height: 190px;
    }
}
</style>

<body>

<header>

</header>

<script>
"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = Object.freeze({

    /*
     * 現在使用するモデル。
     *
     * 古いモデル名はここには存在しない。
     */
    model: "gemini-3.8-flash",

    /*
     * Interactions API
     */
    endpoint:
        "https://generativelanguage.googleapis.com/v1beta/interactions",

    /*
     * APIキー保存場所
     */
    apiKeyStorage:
        "indonesian_shadowing_api_key_v41",

    /*
     * 履歴保存場所
     */
    historyStorage:
        "indonesian_shadowing_history_v41",

    /*
     * 一度にGeminiへ送る文数。
     *
     * 長文JSONの途中切れ防止。
     */
    chunkSize: 5,

    /*
     * 出力上限。
     *
     * Interactions APIでは
     * max_tokensではなく
     * max_output_tokens。
     */
    maxOutputTokens: 4096,

    /*
     * Gemini 3.xのthinking level。
     */
    thinkingLevel: "low",

    /*
     * 最大語彙数。
     */
    maxVocabulary: 30,

    /*
     * APIタイムアウト。
     */
    timeout: 90000

});


/* =========================================================
   DOM
   ========================================================= */

const apiKeyInput =
    document.getElementById("apiKey");

const saveApiKeyBtn =
    document.getElementById("saveApiKey");

const clearApiKeyBtn =
    document.getElementById("clearApiKey");

const testApiBtn =
    document.getElementById("testApi");

const apiStatus =
    document.getElementById("apiStatus");

const inputText =
    document.getElementById("inputText");

const translateBtn =
    document.getElementById("translateBtn");

const sampleBtn =
    document.getElementById("sampleBtn");

const clearBtn =
    document.getElementById("clearBtn");

const result =
    document.getElementById("result");

const vocabulary =
    document.getElementById("vocabulary");

const history =
    document.getElementById("history");

const exportBtn =
    document.getElementById("exportBtn");

const importBtn =
    document.getElementById("importBtn");

const importFile =
    document.getElementById("importFile");

const clearHistoryBtn =
    document.getElementById("clearHistoryBtn");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const debugInfo =
    document.getElementById("debugInfo");


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize() {

    const savedKey =
        localStorage.getItem(
            CONFIG.apiKeyStorage
        );

    if (savedKey) {

        apiKeyInput.value =
            savedKey;

        setApiStatus(
            "保存済みのAPIキーを読み込みました。",
            "success"
        );
    }

    updateDebugInfo();

    loadHistory();

    /*
     * コンソールでも確認できる。
     */
    console.log(
        "================================"
    );

    console.log(
        "Indonesian Shadowing AI v4.1"
    );

    console.log(
        "Gemini model:",
        CONFIG.model
    );

    console.log(
        "Gemini endpoint:",
        CONFIG.endpoint
    );

    console.log(
        "max_output_tokens:",
        CONFIG.maxOutputTokens
    );

    console.log(
        "thinking_level:",
        CONFIG.thinkingLevel
    );

    console.log(
        "================================"
    );
}


/* =========================================================
   DEBUG
   ========================================================= */

function updateDebugInfo() {

    debugInfo.textContent =
`App:
Indonesian Shadowing AI v4.1

Gemini Model:
${CONFIG.model}

Endpoint:
${CONFIG.endpoint}

API:
Interactions API

Output:
Structured JSON

max_output_tokens:
${CONFIG.maxOutputTokens}

thinking_level:
${CONFIG.thinkingLevel}

Chunk Size:
${CONFIG.chunkSize}

Source Indonesian:
JavaScript original input

Gemini Indonesian output:
NOT USED

Gemini Japanese output:
USED

重要:
画面に表示するインドネシア語は、
Geminiの出力ではありません。
ユーザーが入力した原文そのものです。
`;
}


/* =========================================================
   STATUS
   ========================================================= */

function setApiStatus(
    message,
    type = "info"
) {

    apiStatus.textContent =
        message;

    apiStatus.className =
        "status status-" + type;
}


/* =========================================================
   API KEY
   ========================================================= */

saveApiKeyBtn.addEventListener(
    "click",
    () => {

        const key =
            apiKeyInput.value.trim();

        if (!key) {

            setApiStatus(
                "APIキーが空です。",
                "error"
            );

            return;
        }

        localStorage.setItem(
            CONFIG.apiKeyStorage,
            key
        );

        setApiStatus(
            "APIキーを保存しました。",
            "success"
        );
    }
);


clearApiKeyBtn.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            CONFIG.apiKeyStorage
        );

        apiKeyInput.value =
            "";

        setApiStatus(
            "APIキーを削除しました。",
            "success"
        );
    }
);


function getApiKey() {

    const key =
        apiKeyInput.value.trim() ||
        localStorage.getItem(
            CONFIG.apiKeyStorage
        );

    if (!key) {

        throw new Error(
            "Gemini APIキーが設定されていません。"
        );
    }

    return key;
}


/* =========================================================
   FETCH TIMEOUT
   ========================================================= */

async function fetchWithTimeout(
    url,
    options,
    timeout
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        return await fetch(
            url,
            {
                ...options,
                signal:
                    controller.signal
            }
        );

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "Gemini APIがタイムアウトしました。"
            );
        }

        throw error;

    } finally {

        clearTimeout(timer);
    }
}


/* =========================================================
   RESPONSE SCHEMA
   ========================================================= */

function getResponseSchema() {

    return {

        type: "object",

        properties: {

            translations: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        index: {
                            type: "integer"
                        },

                        japanese: {
                            type: "string"
                        }

                    },

                    required: [
                        "index",
                        "japanese"
                    ]
                }
            },

            vocabulary: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        word: {
                            type: "string"
                        },

                        meaning: {
                            type: "string"
                        }

                    },

                    required: [
                        "word",
                        "meaning"
                    ]
                }
            }

        },

        required: [
            "translations",
            "vocabulary"
        ]
    };
}


/* =========================================================
   GEMINI PROMPT
   ========================================================= */

function buildPrompt(
    sentences
) {

    const numbered =
        sentences
            .map(
                (sentence, index) =>
                    `[${index}] ${sentence}`
            )
            .join("\n");


    return `
あなたはインドネシア語学習用の日本語翻訳AIです。

以下のインドネシア語を日本語に翻訳してください。

【絶対ルール】

1. 入力されたインドネシア語を変更しない。
2. 入力されたインドネシア語を再生成しない。
3. インドネシア語本文を回答として出力しない。
4. translationsには日本語訳だけを入れる。
5. indexは入力された番号をそのまま使用する。
6. すべての入力文について1つずつ日本語訳を返す。
7. 文を結合しない。
8. 文を分割しない。
9. 翻訳にインドネシア語を混ぜない。
10. 翻訳以外の説明を書かない。
11. vocabulary.wordはインドネシア語。
12. vocabulary.meaningは日本語。
13. JSON以外の文字を出力しない。

【翻訳方針】

・自然な日本語にする。
・意味を勝手に追加しない。
・意味を勝手に省略しない。
・固有名詞は原文の意味を保つ。
・聖書の書名、章、節などは正確に扱う。
・敬意や宗教的表現など、原文のニュアンスを保つ。

【入力】

${numbered}
`;
}


/* =========================================================
   GEMINI API
   ========================================================= */

async function callGemini(
    sentences
) {

    const apiKey =
        getApiKey();

    const prompt =
        buildPrompt(
            sentences
        );


    /*
     * 送信内容を確認。
     */
    console.log(
        "Gemini request model:",
        CONFIG.model
    );

    console.log(
        "Gemini request endpoint:",
        CONFIG.endpoint
    );

    console.log(
        "Gemini request sentences:",
        sentences
    );


    const requestBody = {

        model:
            CONFIG.model,

        input:
            prompt,

        /*
         * 現在のInteractions APIでは
         * JSON Schemaはこちら。
         */
        response_format: {

            type: "text",

            mime_type:
                "application/json",

            schema:
                getResponseSchema()
        },

        /*
         * max_tokens ではない。
         */
        generation_config: {

            max_output_tokens:
                CONFIG.maxOutputTokens,

            thinking_level:
                CONFIG.thinkingLevel
        }

    };


    console.log(
        "Gemini request body:",
        requestBody
    );


    const response =
        await fetchWithTimeout(
            CONFIG.endpoint,
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "x-goog-api-key":
                        apiKey
                },

                body:
                    JSON.stringify(
                        requestBody
                    )
            },
            CONFIG.timeout
        );


    const raw =
        await response.text();


    console.log(
        "Gemini HTTP status:",
        response.status
    );

    console.log(
        "Gemini raw response:",
        raw
    );


    if (!response.ok) {

        /*
         * 旧コード検出。
         */
        if (
            raw.includes(
                "gemini-2.5-flash"
            )
        ) {

            throw new Error(
                "古いコードが実行されています。\n" +
                "gemini-2.5-flash がAPI側に送信されています。\n\n" +
                "このv4.1では gemini-3.8-flash のみ使用しています。"
            );
        }


        /*
         * max_tokensが残っていた場合。
         */
        if (
            raw.includes(
                "max_tokens"
            )
        ) {

            throw new Error(
                "max_tokens がAPIリクエストに残っています。\n" +
                "v4.1では max_output_tokens を使用しています。"
            );
        }


        throw new Error(
            `Gemini APIエラー (${response.status}):\n${raw}`
        );
    }


    let data;

    try {

        data =
            JSON.parse(
                raw
            );

    } catch (error) {

        throw new Error(
            "Gemini APIレスポンスをJSONとして解析できませんでした。\n\n" +
            raw.slice(0, 5000)
        );
    }


    console.log(
        "Gemini parsed response:",
        data
    );


    /*
     * incomplete検出。
     */
    if (
        data.status ===
        "incomplete"
    ) {

        throw new Error(
            "Geminiの生成が途中で終了しました。\n" +
            "max_output_tokensに達した可能性があります。\n" +
            "文数を減らして再試行してください。"
        );
    }


    if (
        data.status ===
        "failed"
    ) {

        throw new Error(
            "Gemini Interactionがfailedになりました。\n\n" +
            JSON.stringify(
                data,
                null,
                2
            )
        );
    }


    /*
     * Interactions APIのoutput_text。
     */
    let outputText =
        data.output_text;


    /*
     * 念のためstepsからも探す。
     */
    if (
        !outputText &&
        Array.isArray(
            data.steps
        )
    ) {

        const parts = [];


        for (
            const step
            of data.steps
        ) {

            if (
                step &&
                Array.isArray(
                    step.content
                )
            ) {

                for (
                    const content
                    of step.content
                ) {

                    if (
                        content &&
                        typeof content.text ===
                            "string"
                    ) {

                        parts.push(
                            content.text
                        );
                    }
                }
            }
        }


        outputText =
            parts.join("");
    }


    if (
        typeof outputText !==
            "string" ||
        !outputText.trim()
    ) {

        throw new Error(
            "Geminiのoutput_textが空です。\n\n" +
            JSON.stringify(
                data,
                null,
                2
            )
        );
    }


    outputText =
        cleanJsonText(
            outputText
        );


    let parsed;

    try {

        parsed =
            JSON.parse(
                outputText
            );

    } catch (error) {

        console.error(
            "Gemini output_text:",
            outputText
        );

        throw new Error(
            "GeminiのJSON応答を解析できませんでした。\n\n" +
            "output_text:\n" +
            outputText.slice(
                0,
                5000
            )
        );
    }


    validateGeminiResult(
        parsed,
        sentences.length
    );


    return parsed;
}


/* =========================================================
   JSON CLEAN
   ========================================================= */

function cleanJsonText(
    text
) {

    let value =
        text.trim();


    if (
        value.startsWith(
            "```json"
        )
    ) {

        value =
            value.substring(
                7
            );

    } else if (
        value.startsWith(
            "```"
        )
    ) {

        value =
            value.substring(
                3
            );
    }


    if (
        value.endsWith(
            "```"
        )
    ) {

        value =
            value.substring(
                0,
                value.length - 3
            );
    }


    return value.trim();
}


/* =========================================================
   VALIDATE
   ========================================================= */

function validateGeminiResult(
    data,
    sentenceCount
) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        throw new Error(
            "Geminiの結果がオブジェクトではありません。"
        );
    }


    if (
        !Array.isArray(
            data.translations
        )
    ) {

        throw new Error(
            "Geminiのtranslationsが配列ではありません。"
        );
    }


    if (
        data.translations.length !==
        sentenceCount
    ) {

        throw new Error(
            "翻訳文数が一致しません。\n" +
            `原文: ${sentenceCount}文\n` +
            `翻訳: ${data.translations.length}文`
        );
    }


    const indices =
        new Set();


    for (
        const item
        of data.translations
    ) {

        if (
            !Number.isInteger(
                item.index
            )
        ) {

            throw new Error(
                "Geminiが不正なindexを返しました。"
            );
        }


        if (
            item.index < 0 ||
            item.index >= sentenceCount
        ) {

            throw new Error(
                `indexが範囲外です: ${item.index}`
            );
        }


        if (
            indices.has(
                item.index
            )
        ) {

            throw new Error(
                `indexが重複しています: ${item.index}`
            );
        }


        indices.add(
            item.index
        );


        if (
            typeof item.japanese !==
                "string" ||
            !item.japanese.trim()
        ) {

            throw new Error(
                `日本語訳が空です: index=${item.index}`
            );
        }
    }


    for (
        let i = 0;
        i < sentenceCount;
        i++
    ) {

        if (
            !indices.has(i)
        ) {

            throw new Error(
                `index=${i}の翻訳がありません。`
            );
        }
    }


    if (
        !Array.isArray(
            data.vocabulary
        )
    ) {

        data.vocabulary = [];
    }
}


/* =========================================================
   SENTENCE SPLIT
   ========================================================= */

function splitIndonesianSentences(
    text
) {

    /*
     * 重要:
     *
     * 日本語を削除しない。
     * Geminiの入力を変更しない。
     */

    const normalized =
        text
            .replace(
                /\r\n/g,
                "\n"
            )
            .replace(
                /\r/g,
                "\n"
            )
            .trim();


    if (!normalized) {
        return [];
    }


    const lines =
        normalized
            .split(/\n+/)
            .map(
                line =>
                    line.trim()
            )
            .filter(Boolean);


    const sentences = [];


    for (
        const line
        of lines
    ) {

        /*
         * 文末記号で分割。
         *
         * 11:33 のような章節は
         * 分割しない。
         */
        const parts =
            line.match(
                /[^.!?]+(?:[.!?]+|$)/g
            );


        if (!parts) {

            sentences.push(
                line
            );

            continue;
        }


        for (
            const part
            of parts
        ) {

            const sentence =
                part.trim();


            if (
                sentence
            ) {

                sentences.push(
                    sentence
                );
            }
        }
    }


    return sentences;
}


/* =========================================================
   CHUNK
   ========================================================= */

function chunkArray(
    array,
    size
) {

    const chunks = [];


    for (
        let i = 0;
        i < array.length;
        i += size
    ) {

        chunks.push(
            array.slice(
                i,
                i + size
            )
        );
    }


    return chunks;
}


/* =========================================================
   TRANSLATE ALL
   ========================================================= */

translateBtn.addEventListener(
    "click",
    translateAll
);


async function translateAll() {

    const originalText =
        inputText.value.trim();


    if (!originalText) {

        showResultError(
            "インドネシア語を入力してください。"
        );

        return;
    }


    try {

        getApiKey();

    } catch (error) {

        setApiStatus(
            error.message,
            "error"
        );

        return;
    }


    const sentences =
        splitIndonesianSentences(
            originalText
        );


    if (!sentences.length) {

        showResultError(
            "文章を認識できませんでした。"
        );

        return;
    }


    translateBtn.disabled =
        true;

    progressContainer.classList.remove(
        "hidden"
    );

    progressBar.style.width =
        "0%";


    result.innerHTML =
        `<div class="empty">
            翻訳を開始しています...
        </div>`;


    vocabulary.innerHTML =
        `<div class="empty">
            語彙を抽出中...
        </div>`;


    try {

        const chunks =
            chunkArray(
                sentences,
                CONFIG.chunkSize
            );


        const allTranslations = [];

        const allVocabulary = [];


        for (
            let chunkIndex = 0;
            chunkIndex < chunks.length;
            chunkIndex++
        ) {

            const chunk =
                chunks[chunkIndex];


            progressText.textContent =
                `Gemini処理中... ` +
                `${chunkIndex + 1}/${chunks.length} ` +
                `（全${sentences.length}文）`;


            const response =
                await callGemini(
                    chunk
                );


            /*
             * Geminiのindonesianは
             * 一切使用しない。
             *
             * chunk[index]が原文。
             */

            for (
                const translation
                of response.translations
            ) {

                const original =
                    chunk[
                        translation.index
                    ];


                if (
                    original ===
                    undefined
                ) {

                    throw new Error(
                        "Geminiが存在しないindexを返しました。"
                    );
                }


                allTranslations.push({

                    indonesian:
                        original,

                    japanese:
                        translation.japanese
                });
            }


            if (
                Array.isArray(
                    response.vocabulary
                )
            ) {

                allVocabulary.push(
                    ...response.vocabulary
                );
            }


            const percent =
                Math.round(
                    (
                        (chunkIndex + 1) /
                        chunks.length
                    ) * 100
                );


            progressBar.style.width =
                percent + "%";
        }


        /*
         * chunkごとの順番を
         * そのまま原文順に戻す。
         */

        if (
            allTranslations.length !==
            sentences.length
        ) {

            throw new Error(
                "最終的な原文と翻訳の数が一致しません。"
            );
        }


        const finalResults =
            sentences.map(
                (
                    original,
                    index
                ) => {

                    const translation =
                        allTranslations[
                            index
                        ];


                    if (
                        !translation
                    ) {

                        throw new Error(
                            `翻訳 ${index + 1} がありません。`
                        );
                    }


                    return {

                        index,

                        /*
                         * 絶対にGeminiから取得しない。
                         */
                        indonesian:
                            original,

                        japanese:
                            translation.japanese
                    };
                }
            );


        const cleanVocabulary =
            deduplicateVocabulary(
                allVocabulary
            );


        renderResults(
            finalResults
        );


        renderVocabulary(
            cleanVocabulary
        );


        saveHistory(
            originalText,
            finalResults,
            cleanVocabulary
        );


        progressBar.style.width =
            "100%";


        progressText.textContent =
            `完了：${finalResults.length}文`;


        setApiStatus(
            `翻訳完了：${finalResults.length}文`,
            "success"
        );


    } catch (error) {

        console.error(
            "Translation error:",
            error
        );


        showResultError(
            error.message
        );


        setApiStatus(
            error.message,
            "error"
        );


    } finally {

        translateBtn.disabled =
            false;

        setTimeout(
            () => {

                progressContainer.classList.add(
                    "hidden"
                );

            },
            1500
        );
    }
}

/* =========================================================
   VOCABULARY
   ========================================================= */

function deduplicateVocabulary(
    words
) {

    const map =
        new Map();


    for (
        const item
        of words
    ) {

        if (
            !item ||
            typeof item.word !==
                "string" ||
            typeof item.meaning !==
                "string"
        ) {

            continue;
        }


        const word =
            item.word.trim();

        const meaning =
            item.meaning.trim();


        if (
            !word ||
            !meaning
        ) {

            continue;
        }


        const key =
            word.toLowerCase();


        if (
            !map.has(key)
        ) {

            map.set(
                key,
                {
                    word,
                    meaning
                }
            );
        }
    }


    return Array.from(
        map.values()
    ).slice(
        0,
        CONFIG.maxVocabulary
    );
}


function renderVocabulary(
    words
) {

    vocabulary.innerHTML =
        "";


    if (!words.length) {

        vocabulary.innerHTML =

        card.appendChild(
            word
        );

        card.appendChild(
            meaning
        );

        card.appendChild(
            button
        );


        vocabulary.appendChild(
            card
        );
    }
}


/* =========================================================

function speakIndonesian(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "このブラウザは音声読み上げに対応していません。"
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "id-ID";

    utterance.rate =
        0.85;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );
}

/* =========================================================
   HISTORY
   ========================================================= */

function getHistory() {

    try {

        const raw =
            localStorage.getItem(
                CONFIG.historyStorage
            );


        if (!raw) {
            return [];
        }


        const parsed =
            JSON.parse(
                raw
            );


        return Array.isArray(
            parsed
        )
            ? parsed
            : [];

    } catch (error) {

        console.error(
            error
        );

        return [];
    }
}


function saveHistory(
    originalText,
    results,
    vocab
) {

    const items =
        getHistory();


    const item = {

        id:
            Date.now(),

        createdAt:
            new Date().toISOString(),

        originalText,

        results,

        vocabulary:
            vocab
    };


    items.unshift(
        item
    );


    const limited =
        items.slice(
            0,
            30
        );


    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(
            limited
        )
    );


    loadHistory();
}


function loadHistory() {

    const items =
        getHistory();


    history.innerHTML =
        "";


    if (!items.length) {

        history.innerHTML =
            `<div class="empty">
                履歴はありません。
            </div>`;

        return;
    }


    items.forEach(
        item => {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "history-item";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "history-title";

            title.textContent =
                (
                    item.originalText ||
                    ""
                )
                .split("\n")[0]
                .slice(0, 100);


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "history-date";


            date.textContent =
                new Date(
                    item.createdAt
                ).toLocaleString(
                    "ja-JP"
                );


            const buttons =
                document.createElement(
                    "div"
                );

            buttons.className =
                "button-row";


            const loadBtn =
                document.createElement(
                    "button"
                );

            loadBtn.className =
                "btn-secondary btn-small";

            loadBtn.textContent =
                "読み込む";


            loadBtn.addEventListener(
                "click",
                () =>

                    )
            );

                    "button"
                );

            deleteBtn.className =

}


function loadHistoryItem(

) {

function deleteHistoryItem(
    id
) {

    const items =
        getHistory()
            .filter(
                item =>
                    item.id !== id
            );


    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(
            items
        )
    );


    loadHistory();
}

/* =========================================================
   IMPORT
   ========================================================= */

importBtn.addEventListener(
    "click",
    () => {

        importFile.click();
    }
);


importFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        try {

            const text =
                await file.text();


            const data =
                JSON.parse(
                    text
                );


            let imported;


            if (
                Array.isArray(data)
            ) {

                imported =
                    data;

            } else if (
                Array.isArray(
                    data.history
                )
            ) {

                imported =
                    data.history;

            } else {

                throw new Error(
                    "履歴データがありません。"
                );
            }


            const current =
                getHistory();


            const merged =
                [
                    ...imported,
                    ...current
                ];


            const unique =
                Array.from(
                    new Map(
                        merged.map(
                            item => [
                                item.id,
                                item
                            ]
                        )
                    ).values()
                )
                .sort(
                    (
                        a,
                        b
                    ) =>
                        new Date(
                            b.createdAt
                        ) -
                        new Date(
                            a.createdAt
                        )
                )
                .slice(
                    0,
                    30
                );


            localStorage.setItem(
                CONFIG.historyStorage,
                JSON.stringify(
                    unique
                )
            );


            loadHistory();


            alert(
                `${imported.length}件の履歴を読み込みました。`
            );


        } catch (error) {

            console.error(
                error
            );

            alert(
                "JSONの読み込みに失敗しました。\n\n" +
                error.message
            );

        } finally {

            importFile.value =
                "";
        }
    }
);
