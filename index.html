<script>
"use strict";

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = Object.freeze({

    /*
     * 現在使用するGeminiモデル
     */
    model: "gemini-3.8-flash",

    /*
     * Interactions API
     */
    endpoint:
        "https://generativelanguage.googleapis.com/v1/interactions",

    /*
     * LocalStorage
     */
    apiKeyStorage:
        "indonesian_shadowing_api_key_v50",

    historyStorage:
        "indonesian_shadowing_history_v50",

    /*
     * 1回のAPIリクエストに送る文数
     */
    chunkSize: 5,

    /*
     * 語彙最大数
     */
    maxVocabulary: 30,

    /*
     * APIタイムアウト
     */
    timeout: 90000
});


/* =========================================================
   DOM
   ========================================================= */

const $ = (id) => document.getElementById(id);

const apiKeyInput = $("apiKey");
const inputText = $("inputText");

const saveKeyBtn = $("saveKeyBtn");
const testApiBtn = $("testApiBtn");
const deleteKeyBtn = $("deleteKeyBtn");

const translateBtn = $("translateBtn");
const sampleBtn = $("sampleBtn");
const clearBtn = $("clearBtn");

const apiStatus = $("apiStatus");
const translateStatus = $("translateStatus");

const resultContainer = $("resultContainer");
const vocabularyContainer = $("vocabularyContainer");

const historyContainer = $("historyContainer");

const exportBtn = $("exportBtn");
const importBtn = $("importBtn");
const importFile = $("importFile");
const clearHistoryBtn = $("clearHistoryBtn");

const charCount = $("charCount");
const debugOutput = $("debugOutput");

const infoModel = $("infoModel");
const infoEndpoint = $("infoEndpoint");
const infoChunk = $("infoChunk");
const infoKey = $("infoKey");


/* =========================================================
   初期化
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    infoModel.textContent = CONFIG.model;
    infoEndpoint.textContent = CONFIG.endpoint;
    infoChunk.textContent =
        `${CONFIG.chunkSize}文 / リクエスト`;

    loadApiKey();
    updateCharCount();
    renderHistory();

    inputText.addEventListener(
        "input",
        updateCharCount
    );

    saveKeyBtn.addEventListener(
        "click",
        saveApiKey
    );

    testApiBtn.addEventListener(
        "click",
        testApi
    );

    deleteKeyBtn.addEventListener(
        "click",
        deleteApiKey
    );

    translateBtn.addEventListener(
        "click",
        translateAll
    );

    sampleBtn.addEventListener(
        "click",
        insertSample
    );

    clearBtn.addEventListener(
        "click",
        clearInput
    );

    exportBtn.addEventListener(
        "click",
        exportHistory
    );

    importBtn.addEventListener(
        "click",
        () => importFile.click()
    );

    importFile.addEventListener(
        "change",
        importHistory
    );

    clearHistoryBtn.addEventListener(
        "click",
        clearHistory
    });


    /*
     * 重要：
     * ページ内に古いAPIパラメータが存在していないか確認。
     */
    runStaticSelfCheck();
});


/* =========================================================
   API KEY
   ========================================================= */

function loadApiKey() {

    const key =
        localStorage.getItem(
            CONFIG.apiKeyStorage
        );

    if (key) {

        apiKeyInput.value = key;

        apiStatus.className =
            "status success";

        apiStatus.textContent =
            "APIキーが保存されています。";

        infoKey.textContent =
            "保存済み";

    } else {

        infoKey.textContent =
            "未保存";
    }
}


function saveApiKey() {

    const key =
        apiKeyInput.value.trim();

    if (!key) {

        showStatus(
            apiStatus,
            "error",
            "APIキーを入力してください。"
        );

        return;
    }

    localStorage.setItem(
        CONFIG.apiKeyStorage,
        key
    );

    infoKey.textContent =
        "保存済み";

    showStatus(
        apiStatus,
        "success",
        "APIキーを保存しました。"
    );
}


function deleteApiKey() {

    localStorage.removeItem(
        CONFIG.apiKeyStorage
    );

    apiKeyInput.value = "";

    infoKey.textContent =
        "未保存";

    showStatus(
        apiStatus,
        "info",
        "保存されたAPIキーを削除しました。"
    );
}


function getApiKey() {

    const inputKey =
        apiKeyInput.value.trim();

    if (inputKey) {
        return inputKey;
    }

    return localStorage.getItem(
        CONFIG.apiKeyStorage
    ) || "";
}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    element,
    type,
    message
) {

    element.className =
        `status ${type}`;

    element.textContent =
        message;
}


/* =========================================================
   CHAR COUNT
   ========================================================= */

function updateCharCount() {

    charCount.textContent =
        inputText.value.length;
}


/* =========================================================
   サンプル
   ========================================================= */

function insertSample() {

    inputText.value =
`Yehuwa mau kita mengenal-Nya. Jika kita mencari-Nya, Dia akan membiarkan diri-Nya ditemukan. Melalui Yesus dan Alkitab, Yehuwa menyingkapkan perasaan-Nya kepada kita.`;

    updateCharCount();
}


/* =========================================================
   入力クリア
   ========================================================= */

function clearInput() {

    inputText.value = "";

    updateCharCount();

    resultContainer.innerHTML =
        `<div class="status info">
            まだ翻訳されていません。
        </div>`;

    vocabularyContainer.innerHTML =
        `<div class="status info">
            翻訳すると重要語彙が表示されます。
        </div>`;

    translateStatus.innerHTML = "";
}


/* =========================================================
   インドネシア語文分割
   ========================================================= */

function splitIndonesianSentences(text) {

    /*
     * 改行を空白にする。
     *
     * ここでは日本語文字除去などを絶対にしない。
     * 原文はそのまま保持する。
     */
    const normalized =
        text
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n")
            .replace(/\n+/g, " ")
            .replace(/\s+/g, " ")
            .trim();

    if (!normalized) {
        return [];
    }

    /*
     * ., !, ? を文末として分割。
     */
    const matches =
        normalized.match(
            /[^.!?]+(?:[.!?]+|$)/g
        );

    if (!matches) {
        return [normalized];
    }

    return matches
        .map(s => s.trim())
        .filter(Boolean);
}


/* =========================================================
   Gemini Response Schema
   ========================================================= */

function getResponseSchema() {

    return {

        type: "object",

        properties: {

            translations: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        index: {
                            type: "integer"
                        },

                        japanese: {
                            type: "string"
                        }

                    },

                    required: [
                        "index",
                        "japanese"
                    ]
                }
            },

            vocabulary: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        word: {
                            type: "string"
                        },

                        meaning: {
                            type: "string"
                        }

                    },

                    required: [
                        "word",
                        "meaning"
                    ]
                }
            }

        },

        required: [
            "translations",
            "vocabulary"
        ]
    };
}


/* =========================================================
   Prompt
   ========================================================= */

function buildPrompt(sentences) {

    const numbered =
        sentences
            .map(
                (sentence, i) =>
                    `[${i}] ${sentence}`
            )
            .join("\n");

    return `
あなたはインドネシア語学習アプリの翻訳エンジンです。

以下のインドネシア語の各文を日本語に翻訳してください。

重要なルール：

1. 入力されたインドネシア語を絶対に変更しない。
2. インドネシア語を生成し直さない。
3. responseにはindonesianフィールドを作らない。
4. 各文について日本語訳だけを作る。
5. 入力の番号 [0], [1], [2] ... をそのままindexとして使用する。
6. 1つの入力文につき、必ず1つの日本語訳を作る。
7. 文を勝手に結合しない。
8. 文を勝手に分割しない。
9. インドネシア語と日本語を混ぜない。
10. vocabulary.wordにはインドネシア語を入れる。
11. vocabulary.meaningには日本語の意味を入れる。
12. 説明文は出力しない。
13. JSON形式だけを返す。

入力：

${numbered}
`;
}


/* =========================================================
   Gemini API
   ========================================================= */

async function callGemini(
    sentences,
    options = {}
) {

    const apiKey =
        getApiKey();

    if (!apiKey) {
        throw new Error(
            "Gemini APIキーが設定されていません。"
        );
    }

    const prompt =
        buildPrompt(sentences);


    /*
     * 現在のInteractions API形式。
     *
     * response_mime_type
     * responseMimeType
     * max_tokens
     *
     * は使用しない。
     */
    const requestBody = {

        model: CONFIG.model,

        input: prompt,

        response_format: [

            {
                type: "text",

                mime_type:
                    "application/json",

                schema:
                    getResponseSchema()
            }
        ]
    };


    /*
     * 古いコードが混入していないかチェック。
     */
    const serialized =
        JSON.stringify(requestBody);


    if (
        /"responseMimeType"\s*:/.test(
            serialized
        ) ||
        /"response_mime_type"\s*:/.test(
            serialized
        ) ||
        /"max_tokens"\s*:/.test(
            serialized
        ) ||
        serialized.includes(
            "gemini-2.5-flash"
        )
    ) {

        throw new Error(
            "内部エラー：古いGemini APIパラメータがリクエストに混入しています。"
        );
    }


    debugOutput.textContent =
        "Gemini Request:\n\n" +
        JSON.stringify(
            {
                model: requestBody.model,
                endpoint: CONFIG.endpoint,
                sentenceCount: sentences.length,
                response_format:
                    requestBody.response_format
            },
            null,
            2
        );


    const controller =
        new AbortController();

    const timeoutId =
        setTimeout(
            () => controller.abort(),
            CONFIG.timeout
        );


    let response;

    try {

        response =
            await fetch(
                CONFIG.endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-goog-api-key":
                            apiKey
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        ),

                    signal:
                        controller.signal
                }
            );

    } catch (error) {

        if (
            error &&
            error.name === "AbortError"
        ) {

            throw new Error(
                "Gemini APIがタイムアウトしました。"
            );
        }

        throw new Error(
            "Gemini APIへの接続に失敗しました："
            + error.message
        );

    } finally {

        clearTimeout(timeoutId);
    }


    const rawText =
        await response.text();


    debugOutput.textContent +=
        "\n\nGemini HTTP Status: " +
        response.status +
        "\n\nGemini Raw Response:\n" +
        rawText;


    if (!response.ok) {

        let errorMessage =
            rawText;

        try {

            const errorJson =
                JSON.parse(rawText);

            errorMessage =
                errorJson?.error?.message ||
                rawText;

        } catch (_) {
            /* JSONでなくてもそのまま表示 */
        }

        throw new Error(
            `Gemini APIエラー (${response.status}): ${errorMessage}`
        );
    }


    let data;

    try {

        data =
            JSON.parse(rawText);

    } catch (error) {

        throw new Error(
            "Gemini APIのレスポンス全体をJSONとして解析できませんでした。"
        );
    }


    /*
     * Interactions APIの出力から
     * JSONテキストを取り出す。
     */
    const outputText =
        extractOutputText(data);


    if (!outputText) {

        throw new Error(
            "Geminiの回答テキストを取得できませんでした。"
        );
    }


    const cleaned =
        cleanJsonText(outputText);


    let result;

    try {

        result =
            JSON.parse(cleaned);

    } catch (error) {

        throw new Error(
            "GeminiのJSON応答を解析できませんでした。\n\n"
            + cleaned.slice(0, 3000)
        );
    }


    validateGeminiResult(
        result,
        sentences.length
    );


    return result;
}


/* =========================================================
   Gemini Output Extract
   ========================================================= */

function extractOutputText(data) {

    /*
     * 最優先
     */
    if (
        typeof data.output_text ===
        "string"
    ) {

        return data.output_text;
    }


    /*
     * Interactions APIのoutput配列。
     */
    if (
        Array.isArray(data.output)
    ) {

        const texts = [];

        for (
            const item
            of data.output
        ) {

            if (
                typeof item ===
                "string"
            ) {

                texts.push(item);
                continue;
            }


            if (
                typeof item.text ===
                "string"
            ) {

                texts.push(item.text);
            }


            if (
                Array.isArray(item.content)
            ) {

                for (
                    const content
                    of item.content
                ) {

                    if (
                        typeof content.text ===
                        "string"
                    ) {

                        texts.push(
                            content.text
                        );
                    }
                }
            }
        }

        if (texts.length) {
            return texts.join("\n");
        }
    }


    /*
     * 念のためstepsも対応。
     */
    if (
        Array.isArray(data.steps)
    ) {

        const texts = [];

        for (
            const step
            of data.steps
        ) {

            if (
                typeof step.text ===
                "string"
            ) {

                texts.push(step.text);
            }

            if (
                Array.isArray(step.content)
            ) {

                for (
                    const content
                    of step.content
                ) {

                    if (
                        typeof content.text ===
                        "string"
                    ) {

                        texts.push(
                            content.text
                        );
                    }
                }
            }
        }

        if (texts.length) {
            return texts.join("\n");
        }
    }


    return "";
}


/* =========================================================
   JSON Cleanup
   ========================================================= */

function cleanJsonText(text) {

    let result =
        String(text).trim();


    /*
     * Markdown code fenceを除去。
     */
    result =
        result.replace(
            /^```(?:json)?\s*/i,
            ""
        );

    result =
        result.replace(
            /\s*```$/i,
            ""
        );


    /*
     * JSONの前後に説明が混入した場合、
     * 最初の { と最後の } の間だけ取得。
     */
    const first =
        result.indexOf("{");

    const last =
        result.lastIndexOf("}");


    if (
        first >= 0 &&
        last > first
    ) {

        result =
            result.slice(
                first,
                last + 1
            );
    }


    return result.trim();
}


/* =========================================================
   Gemini結果検証
   ========================================================= */

function validateGeminiResult(
    result,
    expectedCount
) {

    if (
        !result ||
        typeof result !== "object"
    ) {

        throw new Error(
            "GeminiのJSON構造が不正です。"
        );
    }


    if (
        !Array.isArray(
            result.translations
        )
    ) {

        throw new Error(
            "Geminiのtranslationsが配列ではありません。"
        );
    }


    if (
        result.translations.length !==
        expectedCount
    ) {

        throw new Error(
            `翻訳数が一致しません。期待値=${expectedCount}, 実際=${result.translations.length}`
        );
    }


    const indexes =
        new Set();


    for (
        const item
        of result.translations
    ) {

        if (
            !Number.isInteger(
                item.index
            )
        ) {

            throw new Error(
                "translation.indexが不正です。"
            );
        }


        if (
            item.index < 0 ||
            item.index >= expectedCount
        ) {

            throw new Error(
                `translation.indexが範囲外です: ${item.index}`
            );
        }


        if (
            indexes.has(item.index)
        ) {

            throw new Error(
                `translation.indexが重複しています: ${item.index}`
            );
        }


        indexes.add(item.index);


        if (
            typeof item.japanese !==
            "string"
        ) {

            throw new Error(
                `index=${item.index} の日本語訳が不正です。`
            );
        }
    }


    for (
        let i = 0;
        i < expectedCount;
        i++
    ) {

        if (!indexes.has(i)) {

            throw new Error(
                `index=${i} の翻訳がありません。`
            );
        }
    }


    if (
        !Array.isArray(
            result.vocabulary
        )
    ) {

        result.vocabulary = [];
    }
}


/* =========================================================
   全文翻訳
   ========================================================= */

async function translateAll() {

    const text =
        inputText.value.trim();


    if (!text) {

        showStatus(
            translateStatus,
            "warning",
            "インドネシア語を入力してください。"
        );

        return;
    }


    const apiKey =
        getApiKey();


    if (!apiKey) {

        showStatus(
            translateStatus,
            "error",
            "先にGemini APIキーを設定してください。"
        );

        return;
    }


    /*
     * JSが原文を一度だけ分割。
     *
     * ここで得たsentencesが
     * 「絶対に変更しない原文」になる。
     */
    const sentences =
        splitIndonesianSentences(text);


    if (!sentences.length) {

        showStatus(
            translateStatus,
            "warning",
            "翻訳できる文が見つかりませんでした。"
        );

        return;
    }


    translateBtn.disabled = true;

    showStatus(
        translateStatus,
        "info",
        `翻訳開始：${sentences.length}文`
    );


    try {

        const allTranslations = [];
        const allVocabulary = [];


        /*
         * 5文ずつGeminiへ送る。
         */
        for (
            let start = 0;
            start < sentences.length;
            start += CONFIG.chunkSize
        ) {

            const chunk =
                sentences.slice(
                    start,
                    start + CONFIG.chunkSize
                );


            const chunkNumber =
                Math.floor(
                    start /
                    CONFIG.chunkSize
                ) + 1;


            const totalChunks =
                Math.ceil(
                    sentences.length /
                    CONFIG.chunkSize
                );


            showStatus(
                translateStatus,
                "info",
                `翻訳中... ${chunkNumber}/${totalChunks} `
                + `（${start + 1}〜${start + chunk.length}文）`
            );


            const result =
                await callGemini(
                    chunk
                );


            /*
             * Geminiのindexはchunk内のindex。
             */
            for (
                const translation
                of result.translations
            ) {

                const original =
                    chunk[
                        translation.index
                    ];


                /*
                 * 非常に重要：
                 *
                 * 表示するindonesianは
                 * Geminiのindonesianではなく
                 * JavaScriptが保持しているoriginal。
                 */
                allTranslations.push({

                    index:
                        start +
                        translation.index,

                    indonesian:
                        original,

                    japanese:
                        translation.japanese
                });
            }


            if (
                Array.isArray(
                    result.vocabulary
                )
            ) {

                allVocabulary.push(
                    ...result.vocabulary
                );
            }
        }


        /*
         * index順に並べ直す。
         */
        allTranslations.sort(
            (a, b) =>
                a.index - b.index
        );


        /*
         * 語彙の重複除去。
         */
        const vocabulary =
            dedupeVocabulary(
                allVocabulary
            ).slice(
                0,
                CONFIG.maxVocabulary
            );


        const finalResult = {

            createdAt:
                new Date().toISOString(),

            originalText:
                text,

            translations:
                allTranslations,

            vocabulary:
                vocabulary
        };


        /*
         * UI表示
         */
        renderTranslations(
            finalResult.translations
        );

        renderVocabulary(
            finalResult.vocabulary
        );


        /*
         * 履歴保存
         */
        saveHistory(
            finalResult
        );

        renderHistory();


        showStatus(
            translateStatus,
            "success",
            `翻訳完了：${allTranslations.length}文`
        );


    } catch (error) {

        console.error(error);

        showStatus(
            translateStatus,
            "error",
            error.message
        );

    } finally {

        translateBtn.disabled = false;
    }
}


/* =========================================================
   Vocabulary Dedup
   ========================================================= */

function dedupeVocabulary(
    vocabulary
) {

    const map =
        new Map();


    for (
        const item
        of vocabulary
    ) {

        if (!item) {
            continue;
        }


        const word =
            String(
                item.word || ""
            ).trim();

        const meaning =
            String(
                item.meaning || ""
            ).trim();


        if (!word) {
            continue;
        }


        const key =
            word.toLowerCase();


        if (!map.has(key)) {

            map.set(
                key,
                {
                    word,
                    meaning
                }
            );
        }
    }


    return Array.from(
        map.values()
    );
}

/* =========================================================
   TTS
   ========================================================= */

function speakIndonesian(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "このブラウザは音声読み上げに対応していません。"
        );

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "id-ID";

    utterance.rate =
        0.85;

    utterance.pitch =
        1.0;


    window.speechSynthesis.speak(
        utterance
    );
}


function speakJapaneseText(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "ja-JP";

    utterance.rate =
        0.9;


    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   HISTORY
   ========================================================= */

function getHistory() {

    try {

        const raw =
            localStorage.getItem(
                CONFIG.historyStorage
            );

        if (!raw) {
            return [];
        }


        const data =
            JSON.parse(raw);


        if (
            !Array.isArray(data)
        ) {

            return [];
        }


        return data;

    } catch (error) {

        console.error(
            "履歴読み込みエラー",
            error
        );

        return [];
    }
}


function saveHistory(
    result
) {

    const history =
        getHistory();


    history.unshift(
        result
    );


    /*
     * 最大50件。
     */
    const trimmed =
        history.slice(0, 50);


    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(
            trimmed
        )
    );
}


function renderHistory() {

    const history =
        getHistory();


    if (!history.length) {

        historyContainer.innerHTML =
            `<div class="status info">
                履歴はありません。
            </div>`;

        return;
    }


    historyContainer.innerHTML =
        "";


    history.forEach(
        (item, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "history-item";


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "history-date";

            date.textContent =
                formatDate(
                    item.createdAt
                );


            const preview =
                document.createElement(
                    "div"
                );

            preview.className =
                "history-preview";

            const original =
                String(
                    item.originalText || ""
                );


            preview.textContent =
                original.length > 100
                    ? original.slice(0, 100) + "..."
                    : original;


            const buttons =
                document.createElement(
                    "div"
                );

            buttons.className =
                "button-row";


            const loadButton =
                document.createElement(
                    "button"
                );

            loadButton.className =
                "btn-secondary small-button";

            loadButton.textContent =
                "読み込む";

            loadButton.addEventListener(
                "click",
                () =>
                    loadHistoryItem(
                        item
                    )
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "btn-danger small-button";

            deleteButton.textContent =
                "削除";

            deleteButton.addEventListener(
                "click",
                () =>
                    deleteHistoryItem(
                        index
                    )
            );


            buttons.appendChild(
                loadButton
            );

            buttons.appendChild(
                deleteButton
            );


            card.appendChild(
                date
            );

            card.appendChild(
                preview
            );

            card.appendChild(
                buttons
            );


            historyContainer.appendChild(
                card
            );
        }
    );
}


function loadHistoryItem(
    item
) {

    inputText.value =
        item.originalText || "";


    updateCharCount();


    renderTranslations(
        item.translations || []
    );

    renderVocabulary(
        item.vocabulary || []
    );


    showStatus(
        translateStatus,
        "success",
        "履歴を読み込みました。"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function deleteHistoryItem(
    index
) {

    const history =
        getHistory();


    history.splice(
        index,
        1
    );


    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(history)
    );


    renderHistory();
}


function clearHistory() {

    const confirmed =
        confirm(
            "履歴をすべて削除しますか？"
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        CONFIG.historyStorage
    );


    renderHistory();
}


/* =========================================================
   Date
   ========================================================= */

function formatDate(
    iso
) {

    if (!iso) {
        return "";
    }


    const date =
        new Date(iso);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return iso;
    }


    return date.toLocaleString(
        "ja-JP"
    );
}


/* =========================================================
   EXPORT
   ========================================================= */

function exportHistory() {

    const history =
        getHistory();


    const blob =
        new Blob(
            [
                JSON.stringify(
                    history,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href =
        url;

    a.download =
        "indonesian-shadowing-history.json";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(
        url
    );
}


/* =========================================================
   IMPORT
   ========================================================= */

async function importHistory(
    event
) {

    const file =
        event.target.files?.[0];


    if (!file) {
        return;
    }


    try {

        const text =
            await file.text();


        const imported =
            JSON.parse(text);


        if (
            !Array.isArray(imported)
        ) {

            throw new Error(
                "履歴ファイルの形式が不正です。"
            );
        }


        const current =
            getHistory();


        const merged =
            [
                ...imported,
                ...current
            ];


        /*
         * createdAtを使って並べ替え。
         */
        merged.sort(
            (a, b) =>
                new Date(
                    b.createdAt || 0
                ) -
                new Date(
                    a.createdAt || 0
                )
        );


        const unique =
            [];


        const seen =
            new Set();


        for (
            const item
            of merged
        ) {

            const key =
                [
                    item.createdAt,
                    item.originalText
                ].join("|");


            if (
                !seen.has(key)
            ) {

                seen.add(key);

                unique.push(item);
            }
        }


        localStorage.setItem(
            CONFIG.historyStorage,
            JSON.stringify(
                unique.slice(0, 50)
            )
        );


        renderHistory();


        alert(
            "履歴をインポートしました。"
        );

    } catch (error) {

        alert(
            "インポートに失敗しました。\n" +
            error.message
        );

    } finally {

        importFile.value = "";
    }
}
