<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="印シャドーイング">
<meta name="mobile-web-app-capable" content="yes">

<title>インドネシア語 シャドーイング & フラッシュカード</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        padding: 15px;
        padding-top: env(safe-area-inset-top, 15px);
        padding-bottom: env(safe-area-inset-bottom, 15px);
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
    }
    h1 { 
        font-size: 1.1rem; 
        text-align: center; 
        margin: 0 0 10px 0; 
        color: #fff; 
        flex-shrink: 0;
    }
    .card {
        background: #1e1e1e;
        padding: 16px;
        border-radius: 14px;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    label { font-size: 0.85rem; color: #aaa; display: block; width: 100%; }
    
    textarea {
        width: 100%;
        height: 200px;
        padding: 12px;
        background: #2c2c2c;
        border: 1px solid #444;
        border-radius: 8px;
        color: #fff;
        font-size: 0.95rem;
        resize: vertical;
        display: block;
    }
    
    select {
        width: 100%;
        padding: 10px;
        background: #2c2c2c;
        border: 1px solid #444;
        border-radius: 8px;
        color: #fff;
        font-size: 0.9rem;
    }
    .control-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c2c2c;
        padding: 10px 14px;
        border-radius: 8px;
        width: 100%;
    }
    .control-group span { font-size: 0.9rem; color: #ddd; }
    input[type="range"] { flex: 1; margin: 0 12px; }
    
    .btn {
        background-color: #007aff;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        width: 100%;
        text-align: center;
    }
    .btn:active { opacity: 0.8; }
    .btn-secondary { background-color: #3a3a3c; }

    /* プレイヤー画面 */
    #player-area {
        display: none;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
        gap: 10px;
    }
    
    /* モード切替タブ */
    .tab-container {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }
    .tab-btn {
        flex: 1;
        padding: 10px;
        background: #2c2c2c;
        border: none;
        border-radius: 8px;
        color: #aaa;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
    }
    .tab-btn.active {
        background: #007aff;
        color: #fff;
    }

    .script-list {
        flex: 1;
        overflow-y: auto;
        background: #1e1e1e;
        border-radius: 14px;
        padding: 12px;
        -webkit-overflow-scrolling: touch;
    }
    .line-item {
        padding: 14px 16px;
        margin-bottom: 10px;
        border-radius: 10px;
        background: #252528;
        border-left: 4px solid transparent;
        transition: background 0.15s, border-left 0.15s;
    }
    .line-item.active {
        background-color: #1a2f4c !important;
        border-left: 4px solid #007aff !important;
    }

    .id-text {
        font-size: var(--font-size-id, 1.1rem);
        font-weight: bold;
        color: #ffffff;
        line-height: 1.6;
        word-break: break-word;
        overflow-wrap: break-word;
    }
    
    .word-token {
        display: inline-block;
        padding: 2px 4px;
        margin: 1px 2px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.1s;
    }
    .word-token:hover {
        background: rgba(0, 122, 255, 0.3);
    }
    .word-token.highlighted {
        background: #ff9500;
        color: #000;
    }

    .jp-text {
        font-size: var(--font-size-jp, 0.9rem);
        color: #a0a0a5;
        margin-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 6px;
        line-height: 1.3;
        word-break: break-word;
        overflow-wrap: break-word;
    }

    /* フラッシュカードモード用スタイル */
    .flashcard-container {
        display: flex;
        flex-direction: column;
        flex: 1;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 10px;
        height: 100%;
    }
    .flashcard {
        background: #252528;
        width: 100%;
        max-width: 400px;
        min-height: 280px;
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        cursor: pointer;
        border: 1px solid #333;
        transition: transform 0.2s;
    }
    .flashcard:active { transform: scale(0.98); }
    .fc-word {
        font-size: 2rem;
        font-weight: bold;
        color: #007aff;
        margin-bottom: 10px;
        word-break: break-word;
    }
    .fc-hint {
        font-size: 0.8rem;
        color: #888;
    }
    .fc-back-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 15px;
    }
    .fc-meaning {
        font-size: 1.2rem;
        color: #fff;
        font-weight: bold;
    }
    .fc-example {
        font-size: 0.95rem;
        color: #ddd;
        font-style: italic;
    }
    .fc-controls {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 400px;
    }
    .fc-btn {
        flex: 1;
        padding: 12px;
        background: #2c2c2c;
        border: 1px solid #444;
        border-radius: 10px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
    }
    .fc-btn:active { opacity: 0.8; }
    .fc-btn-primary { background: #007aff; border: none; }
</style>


<h1>🇮🇩 インドネシア語 シャドーイング</h1>

<div class="card" id="setup-card">
    <div id="history-section" style="display:none;">
        <label for="history-select">📜 過去の履歴から読み込む</label>
        <select id="history-select" onchange="loadHistory(this.value)">
            <option value="">-- 履歴を選択 --</option>
        </select>
    </div>

    <label for="script-input">インドネシア語テキスト貼り付け (#, ., ? で文節区切り。日本語が含まれていても自動で無視されます)</label>
    <textarea id="script-input" placeholder="例: Saya ingin pergi ke toko # untuk membeli buah-buahan fresh. (日本語混入OK)"></textarea>
    
    <div class="control-group">
        <span>再生速度: <strong id="speed-val">1.0</strong>x</span>
        <input type="range" id="speed-range" min="0.5" max="1.2" step="0.1" value="1.0" oninput="updateSpeedVal(this.value)">
    </div>

    <div class="control-group">
        <span>文字サイズ: <strong id="fontsize-val">標準</strong></span>
        <input type="range" id="fontsize-range" min="0.8" max="1.6" step="0.1" value="1.1" oninput="updateFontSizeVal(this.value)">
    </div>

    <button class="btn" onclick="startApp()">プレイヤーを起動</button>
</div>

<div id="player-area">
    <div class="tab-container">
        <button class="tab-btn active" id="tab-sentence" onclick="switchMode('sentence')">📖 文章モード</button>
        <button class="tab-btn" id="tab-word" onclick="switchMode('word')">🔤 フラッシュカード</button>
    </div>

    <div class="script-list" id="script-list"></div>
    <button class="btn btn-secondary" onclick="backToSetup()">テキスト修正に戻る</button>
</div>
