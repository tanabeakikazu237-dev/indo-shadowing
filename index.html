<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indonesian Shadowing AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: #0f172a;
    color: #e2e8f0;
    font-family:
        -apple-system,

</style>

<body>

<div class="max-w-3xl mx-auto px-4 py-6">

    <header class="mb-6">

            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm leading-7 outline-none focus:border-sky-500"

<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    /*
     * 現在のGemini Flash
     */
    model: "gemini-3.8-flash",

    /*
     * Interactions API
     */
    endpoint:
        "https://generativelanguage.googleapis.com/v1beta/interactions",

    apiKeyStorage:
        "gemini_api_key",

    historyStorage:
        "shadowing_history_v7",

    /*
     * 1回に処理する文数
     *
     * 原文と翻訳の対応を安定させるため
     * 5文ずつ処理
     */
    chunkSize: 5,

    /*
     * 3.8 Flashは最大64k outputに対応。
     * 今回は十分余裕を持たせる。
     */
    maxTokens: 8192,

    /*
     * 語彙数
     */
    maxVocabulary: 30,

    /*
     * API timeout
     */
    timeout: 60000
};


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);

const apiKeyInput =
    $("api-key");

const apiStatus =
    $("api-status");

const sourceText =
    $("source-text");

const analyzeBtn =
    $("analyze-btn");

const clearInputBtn =
    $("clear-input");

const saveKeyBtn =
    $("save-key");

const clearKeyBtn =
    $("clear-key");

const progress =
    $("progress");

const errorBox =
    $("error");

const resultSection =
    $("result-section");

const sentencesBox =
    $("sentences");

const vocabularyBox =
    $("vocabulary");

const sentenceCount =
    $("sentence-count");

const vocabCount =
    $("vocab-count");

const vocabSearch =
    $("vocab-search");

const historyBox =
    $("history");

const clearHistoryBtn =
    $("clear-history");

const exportBtn =
    $("export-btn");

const importFile =
    $("import-file");


/* =========================================================
   STATE
========================================================= */

let currentResult = null;

let currentVocabulary = [];


/* =========================================================
   API KEY
========================================================= */

function loadApiKey() {

    const key =
        localStorage.getItem(
            CONFIG.apiKeyStorage
        );

    if (key) {

        apiKeyInput.value = key;

        apiStatus.textContent =
            "設定済み";

        apiStatus.className =
            "text-xs text-green-400";

    } else {

        apiStatus.textContent =
            "未設定";

        apiStatus.className =
            "text-xs text-slate-400";
    }
}


saveKeyBtn.addEventListener(
    "click",
    () => {

        const key =
            apiKeyInput.value.trim();

        if (!key) {

            showError(
                "Gemini APIキーを入力してください。"
            );

            return;
        }

        localStorage.setItem(
            CONFIG.apiKeyStorage,
            key
        );

        apiStatus.textContent =
            "設定済み";

        apiStatus.className =
            "text-xs text-green-400";

        hideError();
    }
);


clearKeyBtn.addEventListener(
    "click",
    () => {

        localStorage.removeItem(
            CONFIG.apiKeyStorage
        );

        apiKeyInput.value = "";

        apiStatus.textContent =
            "未設定";

        apiStatus.className =
            "text-xs text-slate-400";
    }
);


/* =========================================================
   ERROR / PROGRESS
========================================================= */

function showError(message) {

    errorBox.textContent =
        String(message);

    errorBox.classList.remove(
        "hidden"
    );
}


function hideError() {

    errorBox.textContent = "";

    errorBox.classList.add(
        "hidden"
    );
}


function setProgress(message) {

    progress.textContent =
        message;

    progress.classList.remove(
        "hidden"
    );
}


function hideProgress() {

    progress.classList.add(
        "hidden"
    );
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   ORIGINAL SENTENCE SPLIT
========================================================= */

/*
 * ここは非常に重要。
 *
 * Geminiに文分割させない。
 *
 * JavaScriptが原文を確定する。
 *
 * さらに、
 *
 * removeJapaneseCharacters()
 * trimによる文字改変
 * AIによる原文修正
 *
 * は一切しない。
 */

function splitSourceSentences(rawText) {

    const text =
        String(rawText || "")
            .replace(/\r\n?/gu, "\n")
            .trim();

    if (!text) {
        return [];
    }


    /*
     * # がある場合
     *
     * ユーザー指定の区切りを
     * 最優先。
     */
    if (text.includes("#")) {

        return text
            .split("#")
            .map(s => s.trim())
            .filter(Boolean);
    }


    /*
     * # がない場合は
     * "." を区切りとして使用。
     */
    const parts =
        text
            .split(".")
            .map(s => s.trim())
            .filter(Boolean);

    /*
     * "." を消したので戻す。
     *
     * ここで内容そのものは変更していない。
     */
    return parts.map(
        s => s + "."
    );
}


/* =========================================================
   JSON SCHEMA
========================================================= */

/*
 * Geminiに
 *
 * {
 *   translations: [
 *     {
 *       index: integer,
 *       japanese: string
 *     }
 *   ],
 *   vocabulary: [
 *     {
 *       word: string,
 *       meaning: string
 *     }
 *   ]
 * }
 *
 * だけを返させる。
 */

function buildResponseSchema() {

    return {

        type: "object",

        properties: {

            translations: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        index: {
                            type: "integer"
                        },

                        japanese: {
                            type: "string"
                        }

                    },

                    required: [
                        "index",
                        "japanese"
                    ]
                }
            },

            vocabulary: {

                type: "array",

                items: {

                    type: "object",

                    properties: {

                        word: {
                            type: "string"
                        },

                        meaning: {
                            type: "string"
                        }

                    },

                    required: [
                        "word",
                        "meaning"
                    ]
                }
            }

        },

        required: [
            "translations",
            "vocabulary"
        ]
    };
}


/* =========================================================
   PROMPT
========================================================= */

function buildPrompt(sentences) {

    const input =
        sentences
            .map(
                (sentence, index) =>
                    `${index + 1}. ${sentence}`
            )
            .join("\n");

    return `
あなたは日本語を母語とする
インドネシア語教師です。

以下のインドネシア語文を、
自然で正確な日本語に翻訳してください。

【絶対ルール】

1. 入力文の数を変更しない。
2. 入力文の順番を変更しない。
3. 各入力文に必ず1つの日本語訳を対応させる。
4. indexは入力文の番号と完全に一致させる。
5. インドネシア語原文を出力しない。
6. "indonesian"というフィールドを作らない。
7. 日本語訳にインドネシア語を混ぜない。
8. 原文に存在しない内容を追加しない。
9. 聖書の書名・人名・節番号を勝手に変更しない。
10. JSON以外の文章を出力しない。

【翻訳ルール】

Yehuwa
→ エホバ

Alkitab
→ 聖書

Dia / -Nya / diri-Nya
→ 文脈に応じた自然な日本語

「直訳」ではなく、
日本語として自然にしてください。

ただし、
原文の意味を膨らませたり、
説明を追加したりしないでください。

【語彙】

重要なインドネシア語を最大${CONFIG.maxVocabulary}語まで選んでください。

【入力】

${input}
`;
}


/* =========================================================
   INTERACTIONS API
========================================================= */

async function callGemini(prompt) {

    const apiKey =
        localStorage.getItem(
            CONFIG.apiKeyStorage
        ) ||
        apiKeyInput.value.trim();

    if (!apiKey) {

        throw new Error(
            "Gemini APIキーが設定されていません。"
        );
    }


    const controller =
        new AbortController();

    const timeoutId =
        setTimeout(
            () =>
                controller.abort(),
            CONFIG.timeout
        );


    try {

        const response =
            await fetch(
                CONFIG.endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "x-goog-api-key":
                            apiKey
                    },

                    body: JSON.stringify({

                        model:
                            CONFIG.model,

                        input:
                            prompt,

                        /*
                         * Gemini 3.8 Flash +
                         * Interactions API
                         *
                         * JSON SchemaをAPI側で強制
                         */
                        response_format: {

                            type: "text",

                            mime_type:
                                "application/json",

                            schema:
                                buildResponseSchema()
                        },

                        /*
                         * 出力上限
                         */
                        generation_config: {

                            max_tokens:
                                CONFIG.maxTokens
                        }

                    }),

                    signal:
                        controller.signal
                }
            );


        const raw =
            await response.text();


        if (!response.ok) {

            let message =
                `Gemini APIエラー (${response.status})`;

            try {

                const errorData =
                    JSON.parse(raw);

                const apiMessage =
                    errorData?.error?.message ||
                    errorData?.message;

                if (apiMessage) {
                    message +=
                        `: ${apiMessage}`;
                }

            } catch {

                if (raw) {
                    message +=
                        `: ${raw.slice(0, 1000)}`;
                }
            }

            throw new Error(message);
        }


        let data;

        try {

            data =
                JSON.parse(raw);

        } catch {

            console.error(
                "Interactions raw response:",
                raw
            );

            throw new Error(
                "Geminiから有効なJSONレスポンスを受信できませんでした。"
            );
        }


        /*
         * Interactions APIの
         * model_outputを探す。
         */

        let outputText = "";


        if (
            typeof data.output_text ===
            "string"
        ) {

            outputText =
                data.output_text;
        }


        /*
         * stepsから探す
         */
        if (!outputText) {

            const steps =
                Array.isArray(data.steps)
                    ? data.steps
                    : [];

            for (
                const step of steps
            ) {

                if (
                    step?.type !==
                    "model_output"
                ) {
                    continue;
                }

                const contents =
                    Array.isArray(
                        step.content
                    )
                        ? step.content
                        : [];

                for (
                    const content of contents
                ) {

                    if (
                        content?.type ===
                            "text" &&
                        typeof content.text ===
                            "string"
                    ) {

                        outputText +=
                            content.text;
                    }
                }
            }
        }


        if (!outputText) {

            throw new Error(
                `Geminiの出力が空です。status=${data.status || "unknown"}`
            );
        }


        /*
         * JSON Schemaを指定しているため、
         * 基本的には普通にparseできる。
         */
        try {

            return JSON.parse(
                outputText
            );

        } catch (error) {

            console.error(
                "Gemini output_text:",
                outputText
            );

            throw new Error(
                "Geminiの構造化JSONを解析できませんでした。"
            );
        }


    } catch (error) {

        if (
            error?.name ===
            "AbortError"
        ) {

            throw new Error(
                "Gemini APIがタイムアウトしました。"
            );
        }

        throw error;

    } finally {

        clearTimeout(
            timeoutId
        );
    }
}


/* =========================================================
   TRANSLATION COMBINE
========================================================= */

function combineTranslations(
    sourceSentences,
    aiData
) {

    const translations =
        Array.isArray(
            aiData?.translations
        )
            ? aiData.translations
            : [];


    const map =
        new Map();


    for (
        const item of translations
    ) {

        const index =
            Number(item?.index);

        const japanese =
            String(
                item?.japanese || ""
            ).trim();


        if (
            Number.isInteger(index) &&
            japanese
        ) {

            map.set(
                index,
                japanese
            );
        }
    }


    /*
     * ここでも原文は
     * sourceSentencesから取る。
     *
     * Geminiのindonesianは
     * 存在しないので、
     * 改変される可能性もない。
     */

    return sourceSentences.map(
        (original, index) => {

            return {

                indonesian:
                    original,

                japanese:
                    map.get(index + 1) ||
                    "（日本語訳なし）"
            };
        }
    );
}


/* =========================================================
   VOCABULARY MERGE
========================================================= */

function mergeVocabulary(
    vocabularyLists
) {

    const map =
        new Map();


    for (
        const list of vocabularyLists
    ) {

        if (
            !Array.isArray(list)
        ) {
            continue;
        }


        for (
            const item of list
        ) {

            const word =
                String(
                    item?.word || ""
                ).trim();

            const meaning =
                String(
                    item?.meaning || ""
                ).trim();


            if (
                !word ||
                !meaning
            ) {
                continue;
            }


            const key =
                word.toLowerCase();


            if (!map.has(key)) {

                map.set(
                    key,
                    {
                        word,
                        meaning
                    }
                );
            }
        }
    }


    return Array
        .from(map.values())
        .slice(
            0,
            CONFIG.maxVocabulary
        );
}


/* =========================================================
   MAIN ANALYSIS
========================================================= */

async function analyzeWithGemini(
    rawText
) {

    /*
     * ① 原文をJS側で確定
     */
    const sourceSentences =
        splitSourceSentences(
            rawText
        );


    if (
        !sourceSentences.length
    ) {

        throw new Error(
            "文を認識できませんでした。"
        );
    }


    /*
     * ② チャンク分割
     */
    const chunks = [];


    for (
        let i = 0;
        i < sourceSentences.length;
        i += CONFIG.chunkSize
    ) {

        chunks.push(
            sourceSentences.slice(
                i,
                i + CONFIG.chunkSize
            )
        );
    }


    const allSentences = [];

    const vocabularyLists = [];


    /*
     * ③ 各チャンクを翻訳
     */
    for (
        let i = 0;
        i < chunks.length;
        i++
    ) {

        setProgress(
            `翻訳中… ${i + 1} / ${chunks.length}`
        );


        const chunk =
            chunks[i];


        const aiData =
            await callGemini(
                buildPrompt(chunk)
            );


        const translated =
            combineTranslations(
                chunk,
                aiData
            );


        allSentences.push(
            ...translated
        );


        vocabularyLists.push(
            aiData?.vocabulary || []
        );
    }


    /*
     * ④ 最終結果
     */
    return {

        sentences:
            sourceSentences.map(
                (original, index) => {

                    return {

                        /*
                         * ★原文は100% JS由来
                         */
                        indonesian:
                            original,

                        japanese:
                            allSentences[index]
                                ?.japanese ||
                            "（日本語訳なし）"
                    };
                }
            ),

        vocabulary:
            mergeVocabulary(
                vocabularyLists
            )
    };
}


/* =========================================================
   RENDER SENTENCES
========================================================= */

function renderSentences(
    sentences
) {

    sentencesBox.innerHTML = "";


    sentences.forEach(
        (sentence, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "sentence-card p-4";


            card.innerHTML = `

                <div class="text-xs text-slate-500 mb-2">
                    ${index + 1}
                </div>

                <div class="text-base leading-7 text-white">
                    ${escapeHtml(
                        sentence.indonesian
                    )}
                </div>

                <div class="jp mt-3 pl-3 text-sm leading-7 text-slate-300">
                    ${escapeHtml(
                        sentence.japanese
                    )}
                </div>

                <div class="flex gap-2 mt-4">

                    <button
                        class="speak-btn btn bg-sky-700 hover:bg-sky-600 rounded-lg px-3 py-2 text-xs"
                        data-index="${index}"
                    >
                        🔊 再生
                    </button>

                    <button
                        class="copy-btn btn bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-2 text-xs"
                        data-index="${index}"
                    >
                        コピー
                    </button>

                </div>
            `;


            sentencesBox.appendChild(
                card
            );
        }
    );


    document
        .querySelectorAll(
            ".speak-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const index =
                        Number(
                            button.dataset.index
                        );


                    speakIndonesian(
                        sentences[index]
                            .indonesian
                    );
                }
            );
        });


    document
        .querySelectorAll(
            ".copy-btn"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const index =
                        Number(
                            button.dataset.index
                        );


                    const sentence =
                        sentences[index];


                    const text =
                        `${sentence.indonesian}\n${sentence.japanese}`;


                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                text
                            );


                        button.textContent =
                            "コピー済み";


                        setTimeout(
                            () => {

                                button.textContent =
                                    "コピー";

                            },
                            1200
                        );

                    } catch {

                        showError(
                            "コピーに失敗しました。"
                        );
                    }
                }
            );
        });


    sentenceCount.textContent =
        `${sentences.length}文`;
}


/* =========================================================
   SPEECH
========================================================= */

function speakIndonesian(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        showError(
            "このブラウザは音声読み上げに対応していません。"
        );

        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "id-ID";

    utterance.rate =
        0.85;

    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   VOCABULARY
========================================================= */

function renderVocabulary(
    vocabulary
) {

    currentVocabulary =
        Array.isArray(vocabulary)
            ? vocabulary
            : [];


    vocabCount.textContent =
        `${currentVocabulary.length}語`;


    renderFilteredVocabulary();
}


function renderFilteredVocabulary() {

    const query =
        vocabSearch.value
            .trim()
            .toLowerCase();


    const filtered =
        currentVocabulary.filter(
            item => {

                const word =
                    String(
                        item.word || ""
                    ).toLowerCase();

                const meaning =
                    String(
                        item.meaning || ""
                    ).toLowerCase();


                return (
                    !query ||
                    word.includes(query) ||
                    meaning.includes(query)
                );
            }
        );


    vocabularyBox.innerHTML = "";


    if (
        !filtered.length
    ) {

        vocabularyBox.innerHTML = `
            <div class="text-sm text-slate-500 py-4 text-center">
                単語がありません。
            </div>
        `;

        return;
    }


    filtered.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "word-chip p-3";


            card.innerHTML = `

                <div class="flex items-center justify-between gap-3">

                    <div>

                        <div class="font-bold text-sky-300">
                            ${escapeHtml(
                                item.word
                            )}
                        </div>

                        <div class="text-sm text-slate-300 mt-1">
                            ${escapeHtml(
                                item.meaning
                            )}
                        </div>

                    </div>

                    <button
                        class="speak-word btn bg-slate-700 hover:bg-slate-600 rounded-lg px-2.5 py-2 text-xs"
                        data-word="${escapeHtml(
                            item.word
                        )}"
                    >
                        🔊
                    </button>

                </div>
            `;


            vocabularyBox.appendChild(
                card
            );
        }
    );


    document
        .querySelectorAll(
            ".speak-word"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    speakIndonesian(
                        button.dataset.word
                    );
                }
            );
        });
}


vocabSearch.addEventListener(
    "input",
    renderFilteredVocabulary
);


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                CONFIG.historyStorage
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveHistory(
    text,
    result
) {

    const history =
        getHistory();


    history.unshift({

        id:
            Date.now(),

        createdAt:
            new Date().toISOString(),

        text,

        result
    });


    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(
            history.slice(0, 20)
        )
    );


    renderHistory();
}


function renderHistory() {

    const history =
        getHistory();


    historyBox.innerHTML = "";


    if (!history.length) {

        historyBox.innerHTML = `
            <div class="text-sm text-slate-500">
                まだ履歴がありません。
            </div>
        `;

        return;
    }


    history.forEach(
        item => {

            const first =
                item
                    ?.result
                    ?.sentences
                    ?.[0]
                    ?.indonesian ||
                item.text ||
                "";


            const date =
                new Date(
                    item.createdAt
                );


            const row =
                document.createElement(
                    "button"
                );


            row.type =
                "button";


            row.className =
                "w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl p-3";


            row.innerHTML = `

                <div class="text-sm text-white line-clamp-2">
                    ${escapeHtml(first)}
                </div>

                <div class="text-xs text-slate-500 mt-1">
                    ${escapeHtml(
                        date.toLocaleString(
                            "ja-JP"
                        )
                    )}
                </div>
            `;


            row.addEventListener(
                "click",
                () => {

                    sourceText.value =
                        item.text || "";


                    currentResult =
                        item.result || null;


                    if (
                        currentResult
                    ) {

                        renderSentences(
                            currentResult
                                .sentences || []
                        );


                        renderVocabulary(
                            currentResult
                                .vocabulary || []
                        );


                        resultSection
                            .classList
                            .remove(
                                "hidden"
                            );
                    }


                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            );


            historyBox.appendChild(
                row
            );
        }
    );
}


clearHistoryBtn.addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "履歴をすべて削除しますか？"
            )
        ) {
            return;
        }


        localStorage.removeItem(
            CONFIG.historyStorage
        );


        renderHistory();
    }
);


/* =========================================================
   ANALYZE
========================================================= */

analyzeBtn.addEventListener(
    "click",
    async () => {

        hideError();


        const text =
            sourceText.value.trim();


        if (!text) {

            showError(
                "インドネシア語を入力してください。"
            );

            return;
        }


        const apiKey =
            localStorage.getItem(
                CONFIG.apiKeyStorage
            ) ||
            apiKeyInput.value.trim();


        if (!apiKey) {

            showError(
                "Gemini APIキーを設定してください。"
            );

            return;
        }


        analyzeBtn.disabled =
            true;

        analyzeBtn.classList.add(
            "opacity-50"
        );


        resultSection.classList.add(
            "hidden"
        );


        try {

            /*
             * APIに送る前に、
             * JS側で原文を確定。
             */
            const originalSentences =
                splitSourceSentences(
                    text
                );


            if (
                !originalSentences.length
            ) {

                throw new Error(
                    "文を認識できませんでした。"
                );
            }


            setProgress(
                `${originalSentences.length}文を処理します…`
            );


            /*
             * Gemini
             */
            const result =
                await analyzeWithGemini(
                    text
                );


            /*
             * 最終防衛線。
             *
             * 画面表示時も、
             * Indonesianは必ず
             * originalSentencesから取得。
             */
            result.sentences =
                originalSentences.map(
                    (original, index) => {

                        return {

                            indonesian:
                                original,

                            japanese:
                                result
                                    ?.sentences
                                    ?.[index]
                                    ?.japanese ||
                                "（日本語訳なし）"
                        };
                    }
                );


            currentResult =
                result;


            renderSentences(
                result.sentences
            );


            renderVocabulary(
                result.vocabulary
            );


            resultSection
                .classList
                .remove(
                    "hidden"
                );


            saveHistory(
                text,
                result
            );


            setProgress(
                "完了しました。"
            );


            setTimeout(
                hideProgress,
                1000
            );


        } catch (error) {

            console.error(
                error
            );


            showError(
                error?.message ||
                "処理中にエラーが発生しました。"
            );


            hideProgress();


        } finally {

            analyzeBtn.disabled =
                false;

            analyzeBtn.classList.remove(
                "opacity-50"
            );
        }
    }
);


/* =========================================================
   CLEAR
========================================================= */

clearInputBtn.addEventListener(
    "click",
    () => {

        sourceText.value = "";

        resultSection.classList.add(
            "hidden"
        );

        sentencesBox.innerHTML = "";

        vocabularyBox.innerHTML = "";

        currentResult = null;

        currentVocabulary = [];

        hideError();

        hideProgress();
    }
);


/* =========================================================
   EXPORT
========================================================= */

exportBtn.addEventListener(
    "click",
    () => {

        const data = {

            exportedAt:
                new Date().toISOString(),

            history:
                getHistory()
        };


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;

        a.download =
            `shadowing-backup-${Date.now()}.json`;


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );
    }
);


/* =========================================================
   IMPORT
========================================================= */

importFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files?.[0];


        if (!file) {
            return;
        }


        try {

            const text =
                await file.text();


            const data =
                JSON.parse(
                    text
                );


            if (
                !Array.isArray(
                    data.history
                )
            ) {

                throw new Error(
                    "履歴データがありません。"
                );
            }


            localStorage.setItem(
                CONFIG.historyStorage,
                JSON.stringify(
                    data.history
                )
            );


            renderHistory();


            alert(
                "インポートしました。"
            );


        } catch (error) {

            console.error(
                error
            );


            showError(
                "インポートできませんでした。"
            );
        }


        importFile.value = "";
    }
);


/* =========================================================
   INIT
========================================================= */

loadApiKey();

renderHistory();

</script>
