<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indonesian Shadowing AI</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: #0f172a;
        color: #e2e8f0;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
    }

    .btn {
        transition: all .15s ease;
    }

    .btn:active {
        transform: scale(.97);
    }

    textarea {
        resize: vertical;
    }

    .sentence-card {
        background: #172033;
        border: 1px solid #334155;
        border-radius: 14px;
    }

    .jp {
        border-left: 3px solid #38bdf8;
    }

    .word-chip {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
    }

    .loading {
        animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: .45; }
        50% { opacity: 1; }
    }

    .hidden {
        display: none !important;
    }

    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 10px;
    }
</style>
</head>

<body>

<div class="max-w-3xl mx-auto px-4 py-6">

    <!-- Header -->
    <header class="mb-6">
        <h1 class="text-2xl font-bold text-white">
            🇮🇩 Indonesian Shadowing AI
        </h1>
        <p class="text-sm text-slate-400 mt-1">
            インドネシア語 → 自然な日本語訳 + 単語カード
        </p>
    </header>

    <!-- API Key -->
    <section class="card p-4 mb-5">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-white">Gemini API</h2>

        <input
            id="api-key"

        >

        <div class="flex gap-2 mt-3">
            <button
                id="save-key"

            <button
                id="clear-key"

            >
                消去
            </button>
        </div>
    </section>

    <!-- Input -->
    <section class="card p-4 mb-5">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-white">インドネシア語</h2>
            <span class="text-xs text-slate-500">
                # で文を区切ることもできます
            </span>
        </div>

        <textarea
            id="source-text"
            rows="8"
            placeholder="例：
Saat memikirkan hikmat Yehuwa, kita merasa sangat kecil.#
Yehuwa mau kita mengenal-Nya."
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm leading-7 outline-none focus:border-sky-500"
        ></textarea>

        <div class="flex gap-2 mt-3">
            <button

        <!-- Vocabulary -->
        <div class="card p-4 mb-5">

            </div>

            <input
                id="vocab-search"
                type="search"

            >

    <!-- History -->
    <section class="card p-4 mb-5">
        <div class="flex items-center justify-between mb-3">

            <button

                class="text-xs text-red-400 hover:text-red-300"

                履歴を削除
            </button>
        </div>

        <div id="history" class="space-y-2"></div>
    </section>

    <!-- Export -->
    <section class="card p-4">
        <h2 class="font-bold text-white mb-3">データ</h2>

        <div class="flex gap-2">
            <button
                id="export-btn"
                class="btn flex-1 bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5 text-sm"
            >
                エクスポート
            </button>

            <label
                class="btn flex-1 bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5 text-sm text-center cursor-pointer"
            >
                インポート
                <input
                    id="import-file"
                    type="file"
                    accept=".json"
                    class="hidden"
                >
            </label>
        </div>
    </section>

</div>

<script>
"use strict";

/* =========================================================
   Configuration
========================================================= */

const CONFIG = {
    model: "gemini-2.5-flash",
    endpoint:
        "https://generativelanguage.googleapis.com/v1beta/models/",
    apiKeyStorage: "gemini_api_key",
    historyStorage: "shadowing_history_v6",
    cacheStorage: "shadowing_cache_v6",

    // 一度にGeminiへ送る文数
    chunkSize: 5,

    // 1回のAPIレスポンスを十分確保
    maxOutputTokens: 8192,

    // 語彙上限
    maxVocabulary: 30,

    requestTimeout: 60000
};


/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const apiKeyInput = $("api-key");
const apiStatus = $("api-status");

const sourceText = $("source-text");
const analyzeBtn = $("analyze-btn");
const clearInputBtn = $("clear-input");

const saveKeyBtn = $("save-key");
const clearKeyBtn = $("clear-key");

const progress = $("progress");
const errorBox = $("error");

const resultSection = $("result-section");
const sentencesBox = $("sentences");
const vocabularyBox = $("vocabulary");

const sentenceCount = $("sentence-count");
const vocabCount = $("vocab-count");

const vocabSearch = $("vocab-search");

const historyBox = $("history");
const clearHistoryBtn = $("clear-history");

const exportBtn = $("export-btn");
const importFile = $("import-file");


/* =========================================================
   State
========================================================= */

let currentResult = null;
let currentVocabulary = [];


/* =========================================================
   API Key
========================================================= */

function loadApiKey() {
    const key = localStorage.getItem(CONFIG.apiKeyStorage);

    if (key) {
        apiKeyInput.value = key;
        apiStatus.textContent = "設定済み";
        apiStatus.className = "text-xs text-green-400";
    } else {
        apiStatus.textContent = "未設定";
        apiStatus.className = "text-xs text-slate-400";
    }
}

saveKeyBtn.addEventListener("click", () => {
    const key = apiKeyInput.value.trim();

    if (!key) {
        showError("APIキーを入力してください。");
        return;
    }

    localStorage.setItem(CONFIG.apiKeyStorage, key);

    apiStatus.textContent = "設定済み";
    apiStatus.className = "text-xs text-green-400";

    hideError();
});

clearKeyBtn.addEventListener("click", () => {
    localStorage.removeItem(CONFIG.apiKeyStorage);
    apiKeyInput.value = "";

    apiStatus.textContent = "未設定";
    apiStatus.className = "text-xs text-slate-400";
});


/* =========================================================
   Source sentence splitting
   ★ここが今回の重要ポイント
   ★原文を一切加工しない
========================================================= */

function splitSourceSentences(rawText) {
    const text = String(rawText || "")
        .replace(/\r\n?/gu, "\n")
        .trim();

    if (!text) {
        return [];
    }

    /*
     * # がある場合
     * → ユーザーが指定した # を最優先
     */
    if (text.includes("#")) {
        return text
            .split("#")
            .map(s => s.trim())
            .filter(Boolean);
    }

    /*
     * # がない場合
     * → 既存アプリの仕様に合わせて "." で区切る
     *
     * 重要：
     * ここでは日本語除去・AI修正・文字変換などを
     * 一切しない。
     */
    return text
        .split(".")
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => {
            // "." を区切り文字として使ったので、
            // 表示上の原文として自然になるよう戻す
            return s + ".";
        });
}


/* =========================================================
   Utility
========================================================= */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
}


function hideError() {
    errorBox.textContent = "";
    errorBox.classList.add("hidden");
}


function setProgress(message) {
    progress.textContent = message;
    progress.classList.remove("hidden");
}


function hideProgress() {
    progress.classList.add("hidden");
}


/* =========================================================
   Gemini request
========================================================= */

async function callGemini(prompt) {
    const apiKey =
        localStorage.getItem(CONFIG.apiKeyStorage) ||
        apiKeyInput.value.trim();

    if (!apiKey) {
        throw new Error("Gemini APIキーが設定されていません。");
    }

    const url =
        CONFIG.endpoint +
        encodeURIComponent(CONFIG.model) +
        ":generateContent";

    const controller = new AbortController();

    const timeoutId = setTimeout(() => {
        controller.abort();
    }, CONFIG.requestTimeout);

    try {
        const response = await fetch(url, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": apiKey
            },

            body: JSON.stringify({
                contents: [
                    {
                        role: "user",
                        parts: [
                            {
                                text: prompt
                            }
                        ]
                    }
                ],

                generationConfig: {
                    temperature: 0.15,
                    maxOutputTokens: CONFIG.maxOutputTokens,
                    responseMimeType: "application/json"
                }
            }),

            signal: controller.signal
        });

        const raw = await response.text();

        if (!response.ok) {
            throw new Error(
                `Gemini API Error ${response.status}\n${raw.slice(0, 1000)}`
            );
        }

        let outer;

        try {
            outer = JSON.parse(raw);
        } catch {
            throw new Error(
                "Gemini APIからJSONとして読めないレスポンスが返りました。"
            );
        }

        const text =
            outer?.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("") || "";

        const finishReason =
            outer?.candidates?.[0]?.finishReason || "";

        if (!text) {
            throw new Error(
                `Geminiの回答が空です。finishReason=${finishReason || "unknown"}`
            );
        }

        /*
         * MAX_TOKENSで途中終了した場合は、
         * 壊れたJSONを無理やり解析しない。
         */
        if (finishReason === "MAX_TOKENS") {
            throw new Error(
                "Geminiの回答が長すぎて途中で切れました。"
            );
        }

        return parseGeminiJson(text);

    } finally {
        clearTimeout(timeoutId);
    }
}


/* =========================================================
   Gemini JSON parser
========================================================= */

function parseGeminiJson(text) {
    let cleaned = String(text || "").trim();

    /*
     * ```json ... ``` が返ってきた場合
     */
    cleaned = cleaned
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/i, "")
        .trim();

    /*
     * JSONの最初の { から最後の } までだけを見る。
     */
    const first = cleaned.indexOf("{");
    const last = cleaned.lastIndexOf("}");

    if (first === -1 || last === -1 || last <= first) {
        throw new Error(
            "Geminiの回答からJSONオブジェクトを見つけられませんでした。"
        );
    }

    const jsonText = cleaned.slice(first, last + 1);

    try {
        return JSON.parse(jsonText);
    } catch (error) {
        console.error("Gemini JSON parse error:", error);
        console.error("Gemini raw text:", text);

        throw new Error(
            "GeminiのJSON応答を解析できませんでした。"
        );
    }
}


/* =========================================================
   Translation prompt
   ★ Geminiには Indonesian を返させない
========================================================= */

function buildTranslationPrompt(sentences) {

    const numbered = sentences
        .map((sentence, index) => {
            return `${index + 1}. ${sentence}`;
        })
        .join("\n");

    return `
あなたは日本語を母語とするインドネシア語教師です。

以下のインドネシア語文を、日本語へ正確かつ自然に翻訳してください。

【最重要ルール】

1. 入力されたインドネシア語は変更しない。
2. 入力されたインドネシア語を出力JSONに書き戻さない。
3. 日本語訳だけを作成する。
4. 日本語訳にインドネシア語を混ぜない。
5. 原文にない情報を追加しない。
6. 文の順番を絶対に変更しない。
7. 入力文1つにつき、日本語訳を1つだけ作る。
8. 入力文の数とtranslationsの数を完全に一致させる。
9. index番号を必ず維持する。
10. JSON以外の文章を絶対に出力しない。

【翻訳ルール】

- 自然な日本語にする。
- ただし、原文の意味を勝手に膨らませない。
- Yehuwa → エホバ
- Alkitab → 聖書
- Dia / -Nya / diri-Nya は文脈に応じて自然な日本語にする。
- 聖書の書名や節番号を勝手に変更しない。
- 人名・固有名詞の意味を勝手に変更しない。
- 聖書の引用内容を創作しない。

【語彙】

重要なインドネシア語を最大${CONFIG.maxVocabulary}語まで選んでください。

【入力文】

${numbered}

【出力形式】

{
  "translations": [
    {
      "index": 1,
      "japanese": "日本語訳"
    }
  ],
  "vocabulary": [
    {
      "word": "インドネシア語",
      "meaning": "日本語の意味"
    }
  ]
}

必ず上記JSONだけを返してください。
`;
}


/* =========================================================
   Translation validation
   ★ 原文は完全にJS側を使用
========================================================= */

function combineTranslations(sourceSentences, aiData) {

    const translations = Array.isArray(aiData?.translations)
        ? aiData.translations
        : [];

    const translationMap = new Map();

    for (const item of translations) {
        const index = Number(item?.index);

        if (!Number.isInteger(index)) {
            continue;
        }

        const japanese =
            String(item?.japanese || "").trim();

        if (!japanese) {
            continue;
        }

        translationMap.set(index, japanese);
    }

    const result = sourceSentences.map((original, index) => {

        const japanese =
            translationMap.get(index + 1) ||
            "（日本語訳なし）";

        return {
            /*
             * ★絶対にGeminiのindonesianを使わない
             */
            indonesian: original,

            japanese
        };
    });

    return result;
}


/* =========================================================
   Vocabulary merge
========================================================= */

function mergeVocabulary(allVocabulary) {

    const map = new Map();

    for (const item of allVocabulary) {

        if (!item) {
            continue;
        }

        const word =
            String(item.word || "").trim();

        const meaning =
            String(item.meaning || "").trim();

        if (!word || !meaning) {
            continue;
        }

        const key = word.toLowerCase();

        if (!map.has(key)) {
            map.set(key, {
                word,
                meaning
            });
        }
    }

    return Array.from(map.values())
        .slice(0, CONFIG.maxVocabulary);
}


/* =========================================================
   Analyze
========================================================= */

async function analyzeWithGemini(rawText) {

    /*
     * ① JSが原文を確定
     */
    const sourceSentences =
        splitSourceSentences(rawText);

    if (!sourceSentences.length) {
        throw new Error("インドネシア語を入力してください。");
    }

    /*
     * ② 5文ずつGeminiへ送る
     */
    const chunks = [];

    for (
        let i = 0;
        i < sourceSentences.length;
        i += CONFIG.chunkSize
    ) {
        chunks.push(
            sourceSentences.slice(
                i,
                i + CONFIG.chunkSize
            )
        );
    }

    const allTranslations = [];
    const allVocabulary = [];

    for (let i = 0; i < chunks.length; i++) {

        setProgress(
            `翻訳中… ${i + 1} / ${chunks.length}`
        );

        const chunk = chunks[i];

        const data =
            await callGemini(
                buildTranslationPrompt(chunk)
            );

        /*
         * indexは「チャンク内の番号」
         */
        const translated =
            combineTranslations(
                chunk,
                data
            );

        allTranslations.push(...translated);

        if (Array.isArray(data?.vocabulary)) {
            allVocabulary.push(
                ...data.vocabulary
            );
        }
    }

    /*
     * ③ 最終的な文数を原文に合わせる
     */
    const finalSentences =
        sourceSentences.map((original, index) => {

            return {
                indonesian: original,

                japanese:
                    allTranslations[index]?.japanese ||
                    "（日本語訳なし）"
            };
        });

    return {
        sentences: finalSentences,
        vocabulary:
            mergeVocabulary(allVocabulary)
    };
}


/* =========================================================
   Render sentences
========================================================= */

function renderSentences(sentences) {

    sentencesBox.innerHTML = "";

    sentences.forEach((sentence, index) => {

        const card =
            document.createElement("div");

        card.className =
            "sentence-card p-4";

        card.innerHTML = `
            <div class="text-xs text-slate-500 mb-2">
                ${index + 1}
            </div>

            <div class="text-base leading-7 text-white">
                ${escapeHtml(sentence.indonesian)}
            </div>

            <div class="jp mt-3 pl-3 text-sm leading-7 text-slate-300">
                ${escapeHtml(sentence.japanese)}
            </div>

            <div class="flex gap-2 mt-4">

                <button
                    class="speak-btn btn bg-sky-700 hover:bg-sky-600 rounded-lg px-3 py-2 text-xs"
                    data-index="${index}"
                >
                    🔊 再生
                </button>

                <button
                    class="copy-btn btn bg-slate-700 hover:bg-slate-600 rounded-lg px-3 py-2 text-xs"
                    data-index="${index}"
                >
                    コピー
                </button>

            </div>
        `;

        sentencesBox.appendChild(card);
    });

    document
        .querySelectorAll(".speak-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                const index =
                    Number(button.dataset.index);

                speakIndonesian(
                    sentences[index].indonesian
                );
            });
        });

    document
        .querySelectorAll(".copy-btn")
        .forEach(button => {

            button.addEventListener("click", async () => {

                const index =
                    Number(button.dataset.index);

                const sentence =
                    sentences[index];

                const text =
                    `${sentence.indonesian}\n${sentence.japanese}`;

                try {
                    await navigator.clipboard.writeText(text);

                    button.textContent =
                        "コピー済み";

                    setTimeout(() => {
                        button.textContent =
                            "コピー";
                    }, 1200);

                } catch {
                    showError("コピーに失敗しました。");
                }
            });
        });

    sentenceCount.textContent =
        `${sentences.length}文`;
}


/* =========================================================
   Speech
========================================================= */

function speakIndonesian(text) {

    if (!("speechSynthesis" in window)) {
        showError("このブラウザは音声読み上げに対応していません。");
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "id-ID";
    utterance.rate = 0.85;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


/* =========================================================
   Vocabulary
========================================================= */

function renderVocabulary(vocabulary) {

    currentVocabulary = vocabulary || [];

    renderFilteredVocabulary();

    vocabCount.textContent =
        `${currentVocabulary.length}語`;
}


function renderFilteredVocabulary() {

    const query =
        vocabSearch.value
            .trim()
            .toLowerCase();

    const filtered =
        currentVocabulary.filter(item => {

            const word =
                String(item.word || "")
                    .toLowerCase();

            const meaning =
                String(item.meaning || "")
                    .toLowerCase();

            return (
                !query ||
                word.includes(query) ||
                meaning.includes(query)
            );
        });

    vocabularyBox.innerHTML = "";

    if (!filtered.length) {

        vocabularyBox.innerHTML = `
            <div class="text-sm text-slate-500 py-4 text-center">
                単語がありません。
            </div>
        `;

        return;
    }

    filtered.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "word-chip p-3";

        card.innerHTML = `
            <div class="flex items-center justify-between gap-3">

                <div>
                    <div class="font-bold text-sky-300">
                        ${escapeHtml(item.word)}
                    </div>

                    <div class="text-sm text-slate-300 mt-1">
                        ${escapeHtml(item.meaning)}
                    </div>
                </div>

                <button
                    class="speak-word btn bg-slate-700 hover:bg-slate-600 rounded-lg px-2.5 py-2 text-xs"
                    data-word="${escapeHtml(item.word)}"
                >
                    🔊
                </button>

            </div>
        `;

        vocabularyBox.appendChild(card);
    });

    document
        .querySelectorAll(".speak-word")
        .forEach(button => {

            button.addEventListener("click", () => {

                speakIndonesian(
                    button.dataset.word
                );
            });
        });
}


vocabSearch.addEventListener(
    "input",
    renderFilteredVocabulary
);


/* =========================================================
   History
========================================================= */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                CONFIG.historyStorage
            ) || "[]"
        );

    } catch {
        return [];
    }
}


function saveHistory(text, result) {

    const history =
        getHistory();

    const item = {
        id: Date.now(),
        createdAt: new Date().toISOString(),
        text,
        result
    };

    history.unshift(item);

    /*
     * 最大20件
     */
    const trimmed =
        history.slice(0, 20);

    localStorage.setItem(
        CONFIG.historyStorage,
        JSON.stringify(trimmed)
    );

    renderHistory();
}


function renderHistory() {

    const history =
        getHistory();

    historyBox.innerHTML = "";

    if (!history.length) {

        historyBox.innerHTML = `
            <div class="text-sm text-slate-500">
                まだ履歴がありません。
            </div>
        `;

        return;
    }

    history.forEach(item => {

        const firstSentence =
            item?.result?.sentences?.[0]
                ?.indonesian ||
            item.text ||
            "";

        const date =
            new Date(item.createdAt);

        const row =
            document.createElement("button");

        row.type = "button";

        row.className =
            "w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl p-3";

        row.innerHTML = `
            <div class="text-sm text-white line-clamp-2">
                ${escapeHtml(firstSentence)}
            </div>

            <div class="text-xs text-slate-500 mt-1">
                ${escapeHtml(date.toLocaleString("ja-JP"))}
            </div>
        `;

        row.addEventListener("click", () => {

            sourceText.value =
                item.text || "";

            currentResult =
                item.result || null;

            if (currentResult) {

                renderSentences(
                    currentResult.sentences || []
                );

                renderVocabulary(
                    currentResult.vocabulary || []
                );

                resultSection.classList.remove(
                    "hidden"
                );
            }

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });

        historyBox.appendChild(row);
    });
}


clearHistoryBtn.addEventListener(
    "click",
    () => {

        if (!confirm("履歴をすべて削除しますか？")) {
            return;
        }

        localStorage.removeItem(
            CONFIG.historyStorage
        );

        renderHistory();
    }
);


/* =========================================================
   Main analyze button
========================================================= */

analyzeBtn.addEventListener(
    "click",
    async () => {

        hideError();

        const text =
            sourceText.value.trim();

        if (!text) {
            showError(
                "インドネシア語を入力してください。"
            );
            return;
        }

        const key =
            localStorage.getItem(
                CONFIG.apiKeyStorage
            ) ||
            apiKeyInput.value.trim();

        if (!key) {
            showError(
                "先にGemini APIキーを設定してください。"
            );
            return;
        }

        analyzeBtn.disabled = true;
        analyzeBtn.classList.add("opacity-50");

        resultSection.classList.add("hidden");

        try {

            /*
             * 原文を先にJSで確定
             */
            const sourceSentences =
                splitSourceSentences(text);

            if (!sourceSentences.length) {
                throw new Error(
                    "文を認識できませんでした。"
                );
            }

            setProgress(
                `翻訳準備中… ${sourceSentences.length}文`
            );

            /*
             * Gemini処理
             */
            const result =
                await analyzeWithGemini(text);

            /*
             * 念のため表示側でも
             * 原文を再度JS側のものに固定
             */
            result.sentences =
                sourceSentences.map(
                    (original, index) => ({
                        indonesian: original,
                        japanese:
                            result.sentences?.[index]?.japanese ||
                            "（日本語訳なし）"
                    })
                );

            currentResult = result;

            renderSentences(
                result.sentences
            );

            renderVocabulary(
                result.vocabulary
            );

            resultSection.classList.remove(
                "hidden"
            );

            saveHistory(
                text,
                result
            );

            setProgress(
                "完了しました。"
            );

            setTimeout(
                hideProgress,
                1000
            );

        } catch (error) {

            console.error(error);

            showError(
                error?.message ||
                "処理中にエラーが発生しました。"
            );

            hideProgress();

        } finally {

            analyzeBtn.disabled = false;
            analyzeBtn.classList.remove(
                "opacity-50"
            );
        }
    }
);


/* =========================================================
   Clear input
========================================================= */

clearInputBtn.addEventListener(

        sourceText.value = "";

        resultSection.classList.add(
            "hidden"
        );

        vocabularyBox.innerHTML = "";

        currentVocabulary = [];

        hideProgress();

/* =========================================================
   Export
========================================================= */

exportBtn.addEventListener(
    "click",
    () => {

        const data = {
            exportedAt:
                new Date().toISOString(),

            history:
                getHistory()
        };

        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;
        a.download =
            `shadowing-backup-${Date.now()}.json`;

        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);
    }
);


/* =========================================================
   Import
========================================================= */

importFile.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files?.[0];

        if (!file) {
            return;
        }

        try {

            const text =
                await file.text();

            const data =
                JSON.parse(text);

            if (!Array.isArray(data.history)) {
                throw new Error(
                    "履歴データが見つかりません。"
                );
            }

            localStorage.setItem(
                CONFIG.historyStorage,
                JSON.stringify(
                    data.history
                )
            );

            renderHistory();

            alert("インポートしました。");

        } catch (error) {

            console.error(error);

            showError(
                "インポートできませんでした。"
            );
        }

        importFile.value = "";
    }
);

   Initialize
========================================================= */

loadApiKey();
renderHistory();

</script>
